services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      APP_STORE_MODE: "true"
      PORT: "5005"
      NEONWAVE_DB_PATH: /data/database.json
      NEONWAVE_LOCAL_TRACKS_PATH: /data/local-tracks
    volumes:
      - neonwave_data:/data
    expose:
      - "5005"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5005/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      NEONWAVE_DOMAIN: ${NEONWAVE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  neonwave_data:
  caddy_data:
  caddy_config:
